<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
:root{--g:#0b5132;--gold:#e6b84c;--bg:#f5f7f4;--ink:#17231e;--muted:#66736d;--line:#dce4df}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{border-radius:22px;padding:24px}.hero{background:linear-gradient(135deg,var(--g),#073c26);color:#fff;box-shadow:0 16px 40px #0001}.eyebrow{text-transform:uppercase;letter-spacing:.08em;font-weight:800;font-size:13px;color:#f8df94}h1{font-size:clamp(32px,7vw,52px);margin:8px 0}h2{margin:0 0 6px}.theme{font-size:22px;font-weight:700}.event{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.pill{background:#ffffff18;border:1px solid #ffffff2b;border-radius:14px;padding:14px}.pill b{display:block;font-size:12px;color:#f8df94;text-transform:uppercase}.note{margin-top:12px;background:#fff7df;color:#5e4911;padding:12px;border-radius:12px;border-left:5px solid var(--gold)}.card{background:#fff;border:1px solid var(--line);margin-top:16px;box-shadow:0 8px 24px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin-bottom:16px}label{display:block;font-weight:800;margin-bottom:7px}input,select,textarea{width:100%;min-height:60px;border:2px solid #cfd8d2;border-radius:14px;padding:14px;font:inherit;background:#fff}textarea{min-height:95px}.consent{display:flex;gap:12px;background:#f7faf8;padding:14px;border-radius:14px;border:1px solid var(--line);margin:8px 0 18px}.consent input{width:26px;min-height:auto;height:26px}.btn{width:100%;min-height:64px;border:0;border-radius:16px;font-size:20px;font-weight:900;background:var(--g);color:#fff}.status{display:none;margin-top:14px;padding:12px;border-radius:12px}.status.show{display:block}.error{background:#ffe9e9;color:#8e1b1f}.info{background:#eef5ff;color:#174c8f}.success{display:none;text-align:center}.success.show{display:block}.id{display:inline-block;background:#eef3ef;padding:10px 14px;border-radius:999px;font-weight:900}.qr{width:240px;max-width:80%;margin:14px auto;display:block;border:8px solid #fff;box-shadow:0 8px 24px #0002;border-radius:14px}.closed{margin-top:16px;background:#fff0f0;color:#812127;padding:18px;border-radius:14px}@media(max-width:700px){.event,.grid{grid-template-columns:1fr}.hero,.card{padding:20px}body{font-size:17px}input,select,textarea,.btn{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">Parkinson's Disease Warriors Philippines</div><h1>GET TOGETHER 2027</h1><div class="theme"><?= config.THEME ?></div><div class="event"><div class="pill"><b>Date</b><?= config.EVENT_DATE ?></div><div class="pill"><b>Time</b><?= config.EVENT_TIME ?></div><div class="pill"><b>Venue</b><?= config.VENUE ?></div></div><? if(config.EVENT_NOTE){ ?><div class="note"><?= config.EVENT_NOTE ?></div><? } ?></section>
<? if(String(config.REGISTRATION_OPEN).toUpperCase()!=='YES'){ ?><div class="closed">Registration is currently closed.</div><? }else{ ?>
<section id="formCard" class="card"><h2>Event Registration</h2><p style="color:var(--muted)">Large, simple fields for easier mobile use.</p><form id="f"><div class="grid"><div class="field"><label>Full Name *</label><input id="fullName" required></div><div class="field"><label>Mobile Number *</label><input id="mobile" inputmode="tel" required></div></div><div class="grid"><div class="field"><label>Email Address *</label><input id="email" type="email" required></div><div class="field"><label>City / Province *</label><input id="cityProvince" required></div></div><div class="grid"><div class="field"><label>Participant Type *</label><select id="participantType" required><option value="">Select one</option><option>Person with Parkinson’s</option><option>Caregiver</option><option>Family Member</option><option>Doctor / Healthcare Professional</option><option>Guest</option><option>Volunteer</option></select></div><div class="field"><label>Number of Companions</label><select id="companions"><? for(var i=0;i<=10;i++){ ?><option value="<?= i ?>"><?= i ?></option><? } ?></select></div></div><div class="field"><label>Accessibility / Assistance Request (optional)</label><textarea id="accessibility" placeholder="Example: wheelchair access, seating near an exit, check-in assistance"></textarea></div><div class="field"><label>Dietary Concern (optional)</label><textarea id="dietary"></textarea></div><div class="grid"><div class="field"><label>Emergency Contact Name (optional)</label><input id="emergencyName"></div><div class="field"><label>Emergency Contact Number (optional)</label><input id="emergencyNumber" inputmode="tel"></div></div><div class="consent"><input id="privacyConsent" type="checkbox" required><label for="privacyConsent">I agree that my information may be used for event registration, communication, and check-in.</label></div><button id="submit" class="btn">REGISTER NOW</button><div id="status" class="status"></div></form></section>
<section id="success" class="card success"><h2>You're Registered!</h2><p>Your registration has been saved.</p><div id="rid" class="id"></div><img id="qr" class="qr" alt="Registration QR"><p><b>Present this QR code at check-in.</b></p><p><?= config.EVENT_DATE ?> • <?= config.EVENT_TIME ?><br><?= config.VENUE ?></p><p id="emailMsg" style="color:var(--muted)"></p><button class="btn" onclick="location.reload()">REGISTER ANOTHER PERSON</button></section><? } ?></main><script>
const $=id=>document.getElementById(id),form=$('f');function st(m,t){const e=$('status');e.textContent=m;e.className='status show '+t}if(form)form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const b=$('submit');b.disabled=true;b.textContent='REGISTERING…';st('Please wait. Saving your registration.','info');google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='REGISTER NOW';if(!r||!r.ok)return st('Registration failed.','error');$('formCard').style.display='none';$('success').classList.add('show');$('rid').textContent=r.registrationId;$('qr').src='https://quickchart.io/qr?size=320&margin=2&text='+encodeURIComponent(r.qrPayload);$('emailMsg').textContent=r.duplicate?'Existing registration found. Your original ID is shown above.':(r.attendeeEmailSent?'A confirmation email was sent.':'Registration saved. Keep this ID or QR pass.');scrollTo(0,0)}).withFailureHandler(x=>{b.disabled=false;b.textContent='REGISTER NOW';st(x.message||'Something went wrong.','error')}).registerGuest({fullName:$('fullName').value.trim(),mobile:$('mobile').value.trim(),email:$('email').value.trim(),cityProvince:$('cityProvince').value.trim(),participantType:$('participantType').value,companions:$('companions').value,accessibility:$('accessibility').value.trim(),dietary:$('dietary').value.trim(),emergencyName:$('emergencyName').value.trim(),emergencyNumber:$('emergencyNumber').value.trim(),privacyConsent:$('privacyConsent').checked})});
</script></body></html>
