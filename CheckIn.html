<!doctype html><html><head><base target="_top"><meta charset="utf-8"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
:root{--g:#0b5132;--bg:#f5f7f4;--ink:#17231e;--muted:#66736d;--line:#dce4df}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px}.wrap{max-width:980px;margin:auto;padding:14px}.top,.card{border-radius:20px;padding:22px}.top{background:var(--g);color:#fff}.card{background:#fff;border:1px solid var(--line);margin-top:14px}.login{max-width:560px;margin:50px auto}label{display:block;font-weight:800;margin:0 0 7px}input{width:100%;min-height:60px;border:2px solid #cdd8d1;border-radius:14px;padding:14px;font:inherit;margin-bottom:14px}button{min-height:60px;border:0;border-radius:14px;padding:12px 18px;font-size:18px;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#fff}.secondary{background:#eaf2ed;color:var(--g)}.full{width:100%}.status{display:none;margin-top:12px;padding:12px;border-radius:12px}.status.show{display:block}.ok{background:#e9f7ee;color:#0a5a34}.error{background:#ffe8e8;color:#8b1f24}.info{background:#edf4ff;color:#174b8e}#app{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.stat b{display:block;font-size:12px;color:var(--muted);text-transform:uppercase}.stat span{font-size:30px;font-weight:900}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.panel{display:none}.panel.active{display:block}#reader{max-width:560px;margin:auto;overflow:hidden;border-radius:14px}.result{border:1px solid var(--line);border-radius:14px;padding:15px;margin-top:12px}.meta{color:var(--muted);font-size:15px;margin:4px 0}.check{text-align:center;font-size:64px;color:var(--g)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:1fr}body{font-size:17px}input,button{font-size:18px}}
</style></head><body><main class="wrap"><section id="login" class="card login"><h1>PDW 2027 Staff Check-In</h1><p style="color:var(--muted)">Authorized event staff and volunteers only.</p><label>Staff / Volunteer Name</label><input id="staff"><label>Staff PIN</label><input id="pin" type="password" inputmode="numeric"><button id="loginBtn" class="primary full" onclick="login()">OPEN CHECK-IN</button><div id="loginStatus" class="status"></div></section>
<section id="app"><div class="top"><h1 style="margin:0">GET TOGETHER 2027 — CHECK-IN</h1><p id="staffLabel"></p></div><div class="stats"><div class="stat"><b>Registered</b><span id="tot">0</span></div><div class="stat"><b>Checked In</b><span id="in">0</span></div><div class="stat"><b>Pending</b><span id="pend">0</span></div><div class="stat"><b>Companions</b><span id="comp">0</span></div></div><div class="tabs"><button class="primary" onclick="tab('scan')">SCAN QR</button><button class="secondary" onclick="tab('search')">SEARCH NAME / ID</button></div>
<section id="scan" class="card panel active"><h2>Scan Registration QR</h2><div id="reader"></div><button id="start" class="primary full" onclick="startScan()">START CAMERA</button><button id="stop" class="secondary full" style="display:none;margin-top:10px" onclick="stopScan()">STOP CAMERA</button><label style="margin-top:18px">Or paste QR text</label><input id="paste" placeholder="PDW2027|PDW-2027-0001|..."><button class="secondary full" onclick="fromPaste()">CHECK IN FROM QR TEXT</button><div id="scanStatus" class="status"></div><div id="scanResult"></div></section>
<section id="search" class="card panel"><h2>Search Registration</h2><label>Name, Registration ID, or Mobile Number</label><input id="q"><button class="primary full" onclick="searchGuest()">SEARCH</button><div id="searchStatus" class="status"></div><div id="results"></div></section></section></main><script>
let token='',scanner=null,scanning=false,locked=false;const $=id=>document.getElementById(id);function st(id,m,t){const e=$(id);e.textContent=m||'';e.className=m?'status show '+t:'status'}function login(){const b=$('loginBtn'),s=$('staff').value.trim(),p=$('pin').value.trim();if(!s||!p)return st('loginStatus','Enter your name and staff PIN.','error');b.disabled=true;b.textContent='OPENING…';google.script.run.withSuccessHandler(r=>{token=r.token;$('login').style.display='none';$('app').style.display='block';$('staffLabel').textContent='Signed in as '+r.staffName;b.disabled=false;b.textContent='OPEN CHECK-IN';stats()}).withFailureHandler(e=>{b.disabled=false;b.textContent='OPEN CHECK-IN';st('loginStatus',e.message||'Login failed.','error')}).loginAdmin(p,s)}function stats(){google.script.run.withSuccessHandler(s=>{$('tot').textContent=s.total;$('in').textContent=s.checkedIn;$('pend').textContent=s.pending;$('comp').textContent=s.companions}).withFailureHandler(err).getDashboardStats(token)}function tab(x){$('scan').classList.toggle('active',x==='scan');$('search').classList.toggle('active',x==='search');if(x!=='scan')stopScan()}function startScan(){if(scanning)return;locked=false;scanner=new Html5Qrcode('reader');Html5Qrcode.getCameras().then(c=>{if(!c.length)throw Error('No camera found.');return scanner.start(c[c.length-1].id,{fps:10,qrbox:{width:250,height:250}},txt=>{if(locked)return;locked=true;processQr(txt)},()=>{})}).then(()=>{scanning=true;$('start').style.display='none';$('stop').style.display='block';st('scanStatus','Camera ready. Point it at the attendee QR code.','info')}).catch(e=>{scanner=null;scanning=false;st('scanStatus','Camera could not start. Use Search instead. '+(e.message||e),'error')})}function stopScan(){if(!scanner||!scanning)return;scanner.stop().catch(()=>{}).finally(()=>{scanner=null;scanning=false;$('start').style.display='block';$('stop').style.display='none'})}function fromPaste(){const v=$('paste').value.trim();if(!v)return st('scanStatus','Paste the QR text first.','error');processQr(v)}function processQr(v){st('scanStatus','Checking registration…','info');google.script.run.withSuccessHandler(r=>{render(r,'scanResult');st('scanStatus',r.alreadyCheckedIn?'Already checked in.':'Check-in successful.','ok');stats();setTimeout(()=>locked=false,1500)}).withFailureHandler(e=>{locked=false;st('scanStatus',e.message||'Check-in failed.','error')}).checkInByQr(token,v)}function render(r,id){$(id).innerHTML=`<div class="result"><div class="check">${r.alreadyCheckedIn?'↺':'✓'}</div><h3>${esc(r.fullName)}</h3><div class="meta"><b>${esc(r.registrationId)}</b></div><div class="meta">${esc(r.participantType||'')}</div><div class="meta">Companions: ${Number(r.companions||0)}</div><div class="meta">${esc(r.checkedInAt||'')}</div></div>`}function searchGuest(){const q=$('q').value.trim();if(!q)return st('searchStatus','Enter a name, ID, or mobile number.','error');st('searchStatus','Searching…','info');google.script.run.withSuccessHandler(a=>{if(!a.length)return st('searchStatus','No match found.','error');st('searchStatus',a.length+' match(es) found.','ok');$('results').innerHTML=a.map(r=>`<div class="result"><h3>${esc(r.fullName)}</h3><div class="meta"><b>${esc(r.registrationId)}</b></div><div class="meta">${esc(r.participantType||'')} • Mobile ending ${esc(r.mobileLast4||'')}</div><div class="meta">Companions: ${Number(r.companions||0)} • Status: <b>${esc(r.status||'REGISTERED')}</b></div>${String(r.status).toUpperCase()==='ATTENDED'?`<div class="status show ok">Checked in ${esc(r.checkedInAt||'')}</div>`:`<button class="primary full" style="margin-top:10px" onclick="manual('${ea(r.registrationId)}')">CHECK IN</button>`}</div>`).join('')}).withFailureHandler(err).searchGuest(token,q)}function manual(id){google.script.run.withSuccessHandler(()=>{st('searchStatus','Check-in successful.','ok');stats();searchGuest()}).withFailureHandler(err).manualCheckIn(token,id)}function err(e){const m=e&&e.message?e.message:'Action failed.';if(/session expired/i.test(m)){alert(m);location.reload()}else{st('searchStatus',m,'error');st('scanStatus',m,'error')}}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function ea(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
</script></body></html>
